<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="NexaChat conversation list beside an open chat thread">
  <defs>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de0c4"/><stop offset="1" stop-color="#1d9bf0"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7750f5"/><stop offset="1" stop-color="#c86dd7"/>
    </linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a524"/><stop offset="1" stop-color="#f76b1c"/>
    </linearGradient>
    <linearGradient id="a4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37d67a"/><stop offset="1" stop-color="#0aa06e"/>
    </linearGradient>
    <linearGradient id="a5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7c9b"/><stop offset="1" stop-color="#e0396c"/>
    </linearGradient>
    <linearGradient id="own" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de0c4"/><stop offset="1" stop-color="#12b5a0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7750f5" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2de0c4" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="750" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect width="1200" height="750" fill="#0a1728"/>
    <rect x="320" width="880" height="750" fill="url(#glow)"/>

    <!-- ============================ RAIL ============================ -->
    <rect width="320" height="750" fill="#0b1526"/>
    <line x1="320" y1="0" x2="320" y2="750" stroke="#1a2c4a" stroke-width="1"/>

    <!-- brand -->
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#2de0c4" opacity=".12"/>
    <circle cx="37" cy="37" r="8" fill="none" stroke="#2de0c4" stroke-width="2.4"/>
    <circle cx="37" cy="37" r="2.6" fill="#2de0c4"/>
    <text x="66" y="35" fill="#f2f9ff" font-size="15" font-weight="700" letter-spacing="-.3">Nexa<tspan fill="#2de0c4">Chat</tspan></text>
    <text x="66" y="50" fill="#63809e" font-size="9" font-weight="600" letter-spacing="1.4">CONVERSATIONS</text>
    <line x1="0" y1="74" x2="320" y2="74" stroke="#1a2c4a"/>

    <!-- tabs -->
    <text x="34" y="103" fill="#2de0c4" font-size="12" font-weight="600">Chats</text>
    <rect x="30" y="112" width="42" height="2" rx="1" fill="#2de0c4"/>
    <text x="118" y="103" fill="#63809e" font-size="12" font-weight="600">People</text>
    <rect x="26" y="98" width="26" height="14" rx="7" fill="#2de0c4" opacity=".14"/>
    <text x="86" y="103" fill="#2de0c4" font-size="9" font-weight="700">6</text>

    <!-- search -->
    <rect x="16" y="128" width="288" height="38" rx="11" fill="#11203a" stroke="#22385c"/>
    <circle cx="38" cy="147" r="5.4" fill="none" stroke="#63809e" stroke-width="1.7"/>
    <line x1="42" y1="151" x2="46" y2="155" stroke="#63809e" stroke-width="1.7" stroke-linecap="round"/>
    <text x="58" y="152" fill="#63809e" font-size="12">Search conversations</text>

    <!-- rows -->
    <g>
      <!-- active -->
      <rect x="10" y="180" width="300" height="62" rx="12" fill="#2de0c4" opacity=".10"/>
      <rect x="10" y="196" width="3" height="30" rx="1.5" fill="#2de0c4"/>
      <rect x="24" y="192" width="38" height="38" rx="13" fill="url(#a1)"/>
      <text x="43" y="216" fill="#04121c" font-size="13" font-weight="700" text-anchor="middle">AC</text>
      <text x="74" y="205" fill="#f2f9ff" font-size="13" font-weight="600">Amelia Chen</text>
      <text x="74" y="223" fill="#93aec9" font-size="11">That new direction feels so right ✦</text>
      <text x="296" y="205" fill="#63809e" font-size="10" text-anchor="end">9:41</text>

      <rect x="24" y="258" width="38" height="38" rx="13" fill="url(#a2)"/>
      <text x="43" y="282" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">DC</text>
      <rect x="52" y="286" width="16" height="16" rx="5" fill="#7750f5" stroke="#0b1526" stroke-width="2.4"/>
      <circle cx="57" cy="294" r="1.6" fill="#fff"/><circle cx="62" cy="294" r="1.6" fill="#fff"/>
      <text x="74" y="271" fill="#f2f9ff" font-size="13" font-weight="600">Design circle</text>
      <text x="74" y="289" fill="#63809e" font-size="11">Rasel: shipping the new rail today</text>
      <text x="296" y="271" fill="#63809e" font-size="10" text-anchor="end">12m</text>

      <rect x="24" y="324" width="38" height="38" rx="13" fill="url(#a3)"/>
      <text x="43" y="348" fill="#04121c" font-size="13" font-weight="700" text-anchor="middle">MI</text>
      <text x="74" y="337" fill="#f2f9ff" font-size="13" font-weight="600">Maria Islam</text>
      <text x="74" y="355" fill="#63809e" font-size="11">You: sounds perfect, see you then</text>
      <text x="296" y="337" fill="#63809e" font-size="10" text-anchor="end">1h</text>

      <rect x="24" y="390" width="38" height="38" rx="13" fill="url(#a4)"/>
      <text x="43" y="414" fill="#04121c" font-size="13" font-weight="700" text-anchor="middle">QA</text>
