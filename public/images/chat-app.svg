      <circle cx="57" cy="426" r="1.6" fill="#fff"/><circle cx="62" cy="426" r="1.6" fill="#fff"/>
      <text x="74" y="403" fill="#f2f9ff" font-size="13" font-weight="600">Launch squad</text>
      <text x="74" y="421" fill="#63809e" font-size="11">Nazmul: everything is green ✅</text>
      <text x="296" y="403" fill="#63809e" font-size="10" text-anchor="end">3h</text>

      <rect x="24" y="456" width="38" height="38" rx="13" fill="url(#a5)"/>
      <text x="43" y="480" fill="#04121c" font-size="13" font-weight="700" text-anchor="middle">SC</text>
      <text x="74" y="469" fill="#f2f9ff" font-size="13" font-weight="600">Sarah Chen</text>
      <text x="74" y="487" fill="#63809e" font-size="11">Sent the notes over 📄</text>
      <text x="296" y="469" fill="#63809e" font-size="10" text-anchor="end">Tue</text>

      <rect x="24" y="522" width="38" height="38" rx="13" fill="url(#a1)"/>
      <text x="43" y="546" fill="#04121c" font-size="13" font-weight="700" text-anchor="middle">JI</text>
      <text x="74" y="535" fill="#f2f9ff" font-size="13" font-weight="600">Johirul Islam</text>
      <text x="74" y="553" fill="#63809e" font-size="11">Let&#39;s catch up tomorrow</text>
      <text x="296" y="535" fill="#63809e" font-size="10" text-anchor="end">Mon</text>
