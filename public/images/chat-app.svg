    <!-- rail footer -->
    <line x1="0" y1="676" x2="320" y2="676" stroke="#1a2c4a"/>
    <rect x="20" y="694" width="34" height="34" rx="12" fill="url(#a2)"/>
    <text x="37" y="716" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Y</text>
    <circle cx="52" cy="724" r="5" fill="#37d67a" stroke="#0b1526" stroke-width="2.4"/>
    <text x="64" y="707" fill="#2de0c4" font-size="8.5" font-weight="700" letter-spacing="1.2">SIGNED IN</text>
    <text x="64" y="722" fill="#f2f9ff" font-size="12" font-weight="500">You</text>

    <!-- =========================== THREAD =========================== -->
    <line x1="320" y1="74" x2="1200" y2="74" stroke="#1a2c4a"/>
    <rect x="348" y="18" width="38" height="38" rx="13" fill="url(#a1)"/>
    <text x="367" y="42" fill="#04121c" font-size="13" font-weight="700" text-anchor="middle">AC</text>
    <text x="398" y="32" fill="#f2f9ff" font-size="14" font-weight="600">Amelia Chen</text>
    <text x="398" y="49" fill="#63809e" font-size="11">+880 1700 000 001</text>
    <rect x="1030" y="26" width="66" height="22" rx="11" fill="#2de0c4" opacity=".13"/>
    <circle cx="1044" cy="37" r="3.2" fill="#2de0c4"/>
    <text x="1053" y="41" fill="#2de0c4" font-size="9" font-weight="700" letter-spacing=".8">LIVE</text>
    <circle cx="1130" cy="37" r="15" fill="#11203a"/>
    <text x="1130" y="42" fill="#93aec9" font-size="13" font-weight="700" text-anchor="middle">i</text>

    <!-- day divider -->
    <line x1="400" y1="118" x2="700" y2="118" stroke="#1a2c4a"/>
    <text x="760" y="122" fill="#63809e" font-size="9.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">TODAY</text>
    <line x1="820" y1="118" x2="1120" y2="118" stroke="#1a2c4a"/>

    <!-- them -->
    <rect x="400" y="150" width="30" height="30" rx="10" fill="url(#a1)"/>
    <text x="415" y="169" fill="#04121c" font-size="11" font-weight="700" text-anchor="middle">A</text>
    <rect x="440" y="146" width="330" height="38" rx="16" fill="#18304f"/>
    <rect x="440" y="168" width="16" height="16" fill="#18304f"/>
    <text x="460" y="170" fill="#f2f9ff" font-size="13">That new direction feels so right ✦</text>

    <rect x="440" y="190" width="244" height="34" rx="16" fill="#18304f"/>
    <rect x="440" y="190" width="16" height="16" fill="#18304f"/>
    <text x="460" y="212" fill="#f2f9ff" font-size="13">Want to see the prototype?</text>
    <text x="446" y="240" fill="#63809e" font-size="10">9:41 AM</text>

    <!-- own -->
    <rect x="806" y="266" width="294" height="38" rx="16" fill="url(#own)"/>
    <rect x="1084" y="288" width="16" height="16" fill="#12b5a0"/>
    <text x="826" y="290" fill="#04121c" font-size="13" font-weight="500">Yes. Let&#39;s make it happen.</text>
    <rect x="1110" y="270" width="30" height="30" rx="10" fill="url(#a2)"/>
    <text x="1125" y="289" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Y</text>
    <text x="1094" y="322" fill="#63809e" font-size="10" text-anchor="end">9:42 AM</text>
    <path d="M1100 318.5l3 3 5.5-5.5" stroke="#2de0c4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- them again -->
    <rect x="400" y="352" width="30" height="30" rx="10" fill="url(#a1)"/>
    <text x="415" y="371" fill="#04121c" font-size="11" font-weight="700" text-anchor="middle">A</text>
    <rect x="440" y="348" width="378" height="38" rx="16" fill="#18304f"/>
    <rect x="440" y="370" width="16" height="16" fill="#18304f"/>
    <text x="460" y="372" fill="#f2f9ff" font-size="13">Sending it now — it should land instantly ⚡</text>
    <text x="446" y="404" fill="#63809e" font-size="10">9:43 AM</text>

    <!-- own -->
    <rect x="872" y="430" width="228" height="38" rx="16" fill="url(#own)"/>
    <rect x="1084" y="452" width="16" height="16" fill="#12b5a0"/>
    <text x="892" y="454" fill="#04121c" font-size="13" font-weight="500">Got it. Beautiful ✦</text>
    <rect x="1110" y="434" width="30" height="30" rx="10" fill="url(#a2)"/>
    <text x="1125" y="453" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Y</text>
    <text x="1094" y="486" fill="#63809e" font-size="10" text-anchor="end">9:43 AM</text>
    <path d="M1100 482.5l3 3 5.5-5.5" stroke="#2de0c4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- typing -->
    <rect x="400" y="516" width="30" height="30" rx="10" fill="url(#a1)"/>
    <text x="415" y="535" fill="#04121c" font-size="11" font-weight="700" text-anchor="middle">A</text>
    <rect x="440" y="514" width="76" height="34" rx="16" fill="#18304f"/>
    <circle cx="464" cy="531" r="3.4" fill="#93aec9" opacity=".45"/>
    <circle cx="478" cy="531" r="3.4" fill="#93aec9" opacity=".75"/>
    <circle cx="492" cy="531" r="3.4" fill="#93aec9"/>

    <!-- composer -->
    <line x1="320" y1="640" x2="1200" y2="640" stroke="#1a2c4a"/>
    <rect x="400" y="666" width="720" height="50" rx="20" fill="#11203a" stroke="#22385c"/>
    <text x="424" y="697" fill="#63809e" font-size="13">Message Amelia Chen</text>
    <circle cx="1088" cy="691" r="19" fill="url(#own)"/>
    <path d="M1080 691l16-6-6 6 6 6z" fill="#04121c"/>
  </g>

  <rect width="1200" height="750" rx="18" fill="none" stroke="#22385c" stroke-width="1.5"/>
</svg>
