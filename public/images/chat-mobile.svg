<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="NexaChat running on two phones — the conversation list and an open chat">
  <defs>
    <linearGradient id="m1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2de0c4"/><stop offset="1" stop-color="#1d9bf0"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7750f5"/><stop offset="1" stop-color="#c86dd7"/></linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5a524"/><stop offset="1" stop-color="#f76b1c"/></linearGradient>
    <linearGradient id="m4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#37d67a"/><stop offset="1" stop-color="#0aa06e"/></linearGradient>
    <linearGradient id="mOwn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2de0c4"/><stop offset="1" stop-color="#12b5a0"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3f5c"/><stop offset="1" stop-color="#16243c"/>
    </linearGradient>
    <clipPath id="scrA"><rect x="34" y="86" width="228" height="474" rx="26"/></clipPath>
    <clipPath id="scrB"><rect x="474" y="46" width="228" height="474" rx="26"/></clipPath>
    <filter id="drop" x="-30%" y="-15%" width="160%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0b2038" flood-opacity=".28"/>
    </filter>
  </defs>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">

    <!-- ================== PHONE A — conversation list ================== -->
    <g filter="url(#drop)">
      <rect x="22" y="74" width="252" height="498" rx="38" fill="url(#bezel)"/>
      <rect x="34" y="86" width="228" height="474" rx="26" fill="#0b1526"/>
    </g>
    <g clip-path="url(#scrA)">
      <rect x="34" y="86" width="228" height="474" fill="#0b1526"/>
      <!-- status bar -->
      <text x="52" y="108" fill="#93aec9" font-size="9" font-weight="600">9:41</text>
      <rect x="222" y="101" width="22" height="9" rx="2.5" fill="none" stroke="#93aec9" stroke-width="1.2"/>
      <rect x="224" y="103" width="15" height="5" rx="1.5" fill="#2de0c4"/>
      <!-- header -->
      <rect x="50" y="122" width="26" height="26" rx="9" fill="#2de0c4" opacity=".13"/>
      <circle cx="63" cy="135" r="6" fill="none" stroke="#2de0c4" stroke-width="1.9"/>
      <circle cx="63" cy="135" r="2" fill="#2de0c4"/>
      <text x="84" y="140" fill="#f2f9ff" font-size="12.5" font-weight="700">Nexa<tspan fill="#2de0c4">Chat</tspan></text>
      <line x1="34" y1="160" x2="262" y2="160" stroke="#1a2c4a"/>
      <!-- search -->
      <rect x="48" y="174" width="200" height="30" rx="10" fill="#11203a" stroke="#22385c"/>
      <circle cx="66" cy="189" r="4.4" fill="none" stroke="#63809e" stroke-width="1.5"/>
      <line x1="69" y1="192" x2="72" y2="195" stroke="#63809e" stroke-width="1.5" stroke-linecap="round"/>
      <text x="82" y="193" fill="#63809e" font-size="10">Search</text>
      <!-- rows -->
      <g>
        <rect x="42" y="216" width="212" height="50" rx="12" fill="#2de0c4" opacity=".1"/>
        <rect x="52" y="228" width="30" height="30" rx="10" fill="url(#m1)"/>
        <text x="67" y="247" fill="#04121c" font-size="10.5" font-weight="700" text-anchor="middle">AC</text>
        <text x="92" y="239" fill="#f2f9ff" font-size="11" font-weight="600">Amelia Chen</text>
        <text x="92" y="254" fill="#93aec9" font-size="9">That feels so right ✦</text>
        <text x="246" y="239" fill="#63809e" font-size="8" text-anchor="end">9:41</text>

        <rect x="52" y="282" width="30" height="30" rx="10" fill="url(#m2)"/>
        <text x="67" y="301" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">DC</text>
        <text x="92" y="293" fill="#f2f9ff" font-size="11" font-weight="600">Design circle</text>
        <text x="92" y="308" fill="#63809e" font-size="9">Rasel: shipping today</text>
        <text x="246" y="293" fill="#63809e" font-size="8" text-anchor="end">12m</text>

        <rect x="52" y="336" width="30" height="30" rx="10" fill="url(#m3)"/>
        <text x="67" y="355" fill="#04121c" font-size="10.5" font-weight="700" text-anchor="middle">MI</text>
        <text x="92" y="347" fill="#f2f9ff" font-size="11" font-weight="600">Maria Islam</text>
        <text x="92" y="362" fill="#63809e" font-size="9">You: see you then</text>
        <text x="246" y="347" fill="#63809e" font-size="8" text-anchor="end">1h</text>

        <rect x="52" y="390" width="30" height="30" rx="10" fill="url(#m4)"/>
        <text x="67" y="409" fill="#04121c" font-size="10.5" font-weight="700" text-anchor="middle">QA</text>
        <text x="92" y="401" fill="#f2f9ff" font-size="11" font-weight="600">Launch squad</text>
        <text x="92" y="416" fill="#63809e" font-size="9">Nazmul: all green ✅</text>
        <text x="246" y="401" fill="#63809e" font-size="8" text-anchor="end">3h</text>

        <rect x="52" y="444" width="30" height="30" rx="10" fill="url(#m1)"/>
        <text x="67" y="463" fill="#04121c" font-size="10.5" font-weight="700" text-anchor="middle">JI</text>
        <text x="92" y="455" fill="#f2f9ff" font-size="11" font-weight="600">Johirul Islam</text>
        <text x="92" y="470" fill="#63809e" font-size="9">Catch up tomorrow</text>
        <text x="246" y="455" fill="#63809e" font-size="8" text-anchor="end">Mon</text>
      </g>
      <rect x="106" y="540" width="84" height="4" rx="2" fill="#3a5273"/>
    </g>
    <rect x="34" y="86" width="228" height="474" rx="26" fill="none" stroke="#22385c"/>
    <rect x="120" y="94" width="56" height="7" rx="3.5" fill="#0a1728"/>

    <!-- ================== PHONE B — open thread ================== -->
    <g filter="url(#drop)">
      <rect x="462" y="34" width="252" height="498" rx="38" fill="url(#bezel)"/>
      <rect x="474" y="46" width="228" height="474" rx="26" fill="#0a1728"/>
    </g>
    <g clip-path="url(#scrB)">
      <rect x="474" y="46" width="228" height="474" fill="#0a1728"/>
      <text x="492" y="68" fill="#93aec9" font-size="9" font-weight="600">9:43</text>
      <rect x="662" y="61" width="22" height="9" rx="2.5" fill="none" stroke="#93aec9" stroke-width="1.2"/>
      <rect x="664" y="63" width="15" height="5" rx="1.5" fill="#2de0c4"/>

      <!-- header -->
      <path d="M496 92l-7 7 7 7" stroke="#93aec9" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="510" y="85" width="28" height="28" rx="10" fill="url(#m1)"/>
      <text x="524" y="103" fill="#04121c" font-size="10" font-weight="700" text-anchor="middle">AC</text>
      <text x="546" y="96" fill="#f2f9ff" font-size="11.5" font-weight="600">Amelia Chen</text>
      <text x="546" y="110" fill="#63809e" font-size="8.5">online now</text>
      <rect x="644" y="90" width="42" height="18" rx="9" fill="#2de0c4" opacity=".13"/>
      <circle cx="655" cy="99" r="2.6" fill="#2de0c4"/>
      <text x="662" y="102.5" fill="#2de0c4" font-size="7.5" font-weight="700">LIVE</text>
      <line x1="474" y1="126" x2="702" y2="126" stroke="#1a2c4a"/>

      <text x="588" y="150" fill="#63809e" font-size="8" font-weight="700" letter-spacing="1.2" text-anchor="middle">TODAY</text>

      <!-- them -->
      <rect x="492" y="168" width="24" height="24" rx="8" fill="url(#m1)"/>
      <text x="504" y="184" fill="#04121c" font-size="9" font-weight="700" text-anchor="middle">A</text>
      <rect x="522" y="164" width="150" height="30" rx="13" fill="#18304f"/>
      <rect x="522" y="182" width="13" height="12" fill="#18304f"/>
      <text x="536" y="183" fill="#f2f9ff" font-size="10">That feels so right ✦</text>

      <!-- own -->
      <rect x="520" y="208" width="162" height="30" rx="13" fill="url(#mOwn)"/>
      <rect x="669" y="226" width="13" height="12" fill="#12b5a0"/>
      <text x="534" y="227" fill="#04121c" font-size="10" font-weight="500">Yes. Let&#39;s make it happen.</text>

      <!-- them -->
      <rect x="492" y="258" width="24" height="24" rx="8" fill="url(#m1)"/>
      <text x="504" y="274" fill="#04121c" font-size="9" font-weight="700" text-anchor="middle">A</text>
      <rect x="522" y="254" width="164" height="30" rx="13" fill="#18304f"/>
      <rect x="522" y="272" width="13" height="12" fill="#18304f"/>
      <text x="536" y="273" fill="#f2f9ff" font-size="10">Sending it now ⚡</text>

      <!-- own -->
      <rect x="556" y="298" width="126" height="30" rx="13" fill="url(#mOwn)"/>
      <rect x="669" y="316" width="13" height="12" fill="#12b5a0"/>
      <text x="570" y="317" fill="#04121c" font-size="10" font-weight="500">Got it. Beautiful ✦</text>
      <text x="676" y="342" fill="#63809e" font-size="8" text-anchor="end">9:43 AM</text>

      <!-- typing -->
      <rect x="492" y="360" width="24" height="24" rx="8" fill="url(#m1)"/>
      <text x="504" y="376" fill="#04121c" font-size="9" font-weight="700" text-anchor="middle">A</text>
      <rect x="522" y="358" width="62" height="28" rx="13" fill="#18304f"/>
      <circle cx="540" cy="372" r="2.8" fill="#93aec9" opacity=".45"/>
      <circle cx="552" cy="372" r="2.8" fill="#93aec9" opacity=".75"/>
      <circle cx="564" cy="372" r="2.8" fill="#93aec9"/>

      <!-- composer -->
      <line x1="474" y1="452" x2="702" y2="452" stroke="#1a2c4a"/>
      <rect x="492" y="468" width="164" height="34" rx="15" fill="#11203a" stroke="#22385c"/>
      <text x="508" y="489" fill="#63809e" font-size="10">Message…</text>
      <circle cx="678" cy="485" r="15" fill="url(#mOwn)"/>
      <path d="M671 485l13-4.6-4.6 4.6 4.6 4.6z" fill="#04121c"/>
    </g>
    <rect x="474" y="46" width="228" height="474" rx="26" fill="none" stroke="#22385c"/>
    <rect x="560" y="54" width="56" height="7" rx="3.5" fill="#0a1728"/>

    <!-- floating badge between the phones -->
    <g>
      <rect x="286" y="286" width="168" height="46" rx="14" fill="#131d3d" stroke="#3b4a78"/>
      <circle cx="312" cy="309" r="13" fill="#123a3a"/>
      <path d="M306 309l4 4 8-8" stroke="#1fd1b4" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="334" y="304" fill="#f2f6ff" font-size="11" font-weight="700">Delivered live</text>
      <text x="334" y="319" fill="#7386ac" font-size="9.5">to every device at once</text>
    </g>
  </g>
</svg>
