<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Selection mode in the NexaChat rail, with two conversations ticked and a delete button ready">
  <defs>
    <linearGradient id="sl1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1fd1b4"/><stop offset="1" stop-color="#35d0e0"/></linearGradient>
    <linearGradient id="sl2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a8cf7"/><stop offset="1" stop-color="#8b4dff"/></linearGradient>
    <linearGradient id="sl3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5a524"/><stop offset="1" stop-color="#f76b1c"/></linearGradient>
    <linearGradient id="sl4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#37d67a"/><stop offset="1" stop-color="#0aa06e"/></linearGradient>
    <linearGradient id="sl5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7c9b"/><stop offset="1" stop-color="#e0396c"/></linearGradient>
    <linearGradient id="slGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b4dff" stop-opacity=".14"/><stop offset="1" stop-color="#1fd1b4" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="slFrame"><rect width="900" height="600" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#slFrame)" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect width="900" height="600" fill="#0a1728"/>
    <rect x="332" width="568" height="600" fill="url(#slGlow)"/>

    <!-- ============================ RAIL ============================ -->
    <rect width="332" height="600" fill="#0b1526"/>
    <line x1="332" y1="0" x2="332" y2="600" stroke="#1a2c4a"/>

    <!-- brand -->
    <rect x="20" y="18" width="34" height="34" rx="10" fill="rgba(31,209,180,.12)"/>
    <circle cx="37" cy="35" r="8" fill="none" stroke="#1fd1b4" stroke-width="2.4"/>
    <circle cx="37" cy="35" r="2.6" fill="#1fd1b4"/>
    <text x="66" y="33" fill="#f2f6ff" font-size="15" font-weight="700" letter-spacing="-.3">Nexa<tspan fill="#35d0e0">Chat</tspan></text>
    <text x="66" y="48" fill="#7386ac" font-size="9" font-weight="600" letter-spacing="1.4">CONVERSATIONS</text>
    <line x1="0" y1="72" x2="332" y2="72" stroke="#1a2c4a"/>

    <!-- tabs -->
    <text x="34" y="101" fill="#35d0e0" font-size="12" font-weight="600">Chats</text>
    <rect x="30" y="110" width="42" height="2" rx="1" fill="#35d0e0"/>
    <text x="126" y="101" fill="#7386ac" font-size="12" font-weight="600">People</text>

    <!-- ===== selection toolbar (danger tinted) ===== -->
    <rect x="14" y="126" width="304" height="40" rx="12" fill="rgba(255,124,155,.13)" stroke="rgba(255,124,155,.35)"/>
    <path d="M28 140l10 10M38 140l-10 10" stroke="#93aec9" stroke-width="1.8" stroke-linecap="round"/>
    <text x="56" y="151" fill="#f2f9ff" font-size="12" font-weight="600">2 selected</text>
    <text x="212" y="151" fill="#93aec9" font-size="12" font-weight="600">All</text>
    <rect x="240" y="134" width="68" height="24" rx="8" fill="rgba(255,124,155,.2)"/>
    <g stroke="#ff7c9b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M252 141h10M254 141v-1.6a1 1 0 011-1h4a1 1 0 011 1V141M253.5 141l.7 8a1 1 0 001 .9h3.6a1 1 0 001-.9l.7-8"/>
    </g>
    <text x="272" y="150" fill="#ff7c9b" font-size="11.5" font-weight="600">Delete</text>

    <!-- ===== rows ===== -->
    <!-- checked -->
    <rect x="12" y="180" width="308" height="56" rx="12" fill="rgba(255,124,155,.13)"/>
    <rect x="24" y="198" width="20" height="20" rx="6" fill="#ff7c9b"/>
    <path d="M29 208l3.4 3.4 6-6" stroke="#04121c" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="56" y="190" width="36" height="36" rx="13" fill="url(#sl3)"/>
    <text x="74" y="213" fill="#04121c" font-size="12" font-weight="700" text-anchor="middle">MI</text>
    <text x="104" y="203" fill="#f2f9ff" font-size="12.5" font-weight="600">Maria Islam</text>
    <text x="104" y="220" fill="#7386ac" font-size="10.5">You: sounds perfect, see you then</text>
    <text x="308" y="203" fill="#7386ac" font-size="9.5" text-anchor="end">1h</text>

    <!-- unchecked -->
    <rect x="24" y="256" width="20" height="20" rx="6" fill="rgba(0,0,0,.28)" stroke="#22385c" stroke-width="1.5"/>
    <rect x="56" y="248" width="36" height="36" rx="13" fill="url(#sl1)"/>
    <text x="74" y="271" fill="#04121c" font-size="12" font-weight="700" text-anchor="middle">AC</text>
    <text x="104" y="261" fill="#f2f9ff" font-size="12.5" font-weight="600">Amelia Chen</text>
    <text x="104" y="278" fill="#7386ac" font-size="10.5">That new direction feels so right ✦</text>
    <text x="308" y="261" fill="#7386ac" font-size="9.5" text-anchor="end">9:41</text>

    <!-- checked group -->
    <rect x="12" y="296" width="308" height="56" rx="12" fill="rgba(255,124,155,.13)"/>
    <rect x="24" y="314" width="20" height="20" rx="6" fill="#ff7c9b"/>
    <path d="M29 324l3.4 3.4 6-6" stroke="#04121c" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="56" y="306" width="36" height="36" rx="13" fill="url(#sl2)"/>
    <text x="74" y="329" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">QA</text>
    <rect x="84" y="332" width="16" height="16" rx="5" fill="#7750f5" stroke="#0b1526" stroke-width="2.4"/>
    <circle cx="89" cy="340" r="1.6" fill="#fff"/><circle cx="94" cy="340" r="1.6" fill="#fff"/>
    <text x="104" y="319" fill="#f2f9ff" font-size="12.5" font-weight="600">Launch squad</text>
    <text x="104" y="336" fill="#7386ac" font-size="10.5">Nazmul: everything is green ✅</text>
    <text x="308" y="319" fill="#7386ac" font-size="9.5" text-anchor="end">3h</text>

    <!-- unchecked -->
    <rect x="24" y="372" width="20" height="20" rx="6" fill="rgba(0,0,0,.28)" stroke="#22385c" stroke-width="1.5"/>
    <rect x="56" y="364" width="36" height="36" rx="13" fill="url(#sl4)"/>
    <text x="74" y="387" fill="#04121c" font-size="12" font-weight="700" text-anchor="middle">SC</text>
    <text x="104" y="377" fill="#f2f9ff" font-size="12.5" font-weight="600">Sarah Chen</text>
    <text x="104" y="394" fill="#7386ac" font-size="10.5">Sent the notes over 📄</text>
    <text x="308" y="377" fill="#7386ac" font-size="9.5" text-anchor="end">Tue</text>

    <!-- unchecked -->
    <rect x="24" y="430" width="20" height="20" rx="6" fill="rgba(0,0,0,.28)" stroke="#22385c" stroke-width="1.5"/>
    <rect x="56" y="422" width="36" height="36" rx="13" fill="url(#sl5)"/>
    <text x="74" y="445" fill="#04121c" font-size="12" font-weight="700" text-anchor="middle">JI</text>
    <text x="104" y="435" fill="#f2f9ff" font-size="12.5" font-weight="600">Johirul Islam</text>
    <text x="104" y="452" fill="#7386ac" font-size="10.5">Let&#39;s catch up tomorrow</text>
    <text x="308" y="435" fill="#7386ac" font-size="9.5" text-anchor="end">Mon</text>

    <!-- restore line -->
    <line x1="24" y1="492" x2="308" y2="492" stroke="#1a2c4a"/>
    <text x="24" y="513" fill="#7386ac" font-size="10">3 removed from this list</text>
    <rect x="230" y="500" width="78" height="24" rx="8" fill="none" stroke="#1a2c4a"/>
    <g stroke="#93aec9" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M243 508a5 5 0 104-2"/><path d="M244 504v4h4"/>
    </g>
    <text x="262" y="516" fill="#93aec9" font-size="10" font-weight="600">Restore</text>

    <!-- ======================= EXPLAINER PANEL ======================= -->
    <g transform="translate(400 128)">
      <rect width="440" height="150" rx="16" fill="#131d3d" stroke="#3b4a78"/>
      <rect x="24" y="24" width="34" height="34" rx="11" fill="rgba(255,124,155,.16)"/>
      <g stroke="#ff7c9b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(33 33)">
        <path d="M0 3h16M3 3V1a1.5 1.5 0 011.5-1.5h7A1.5 1.5 0 0113 1v2M2 3l1 12a1.5 1.5 0 001.5 1.4h7A1.5 1.5 0 0013 15l1-12"/>
      </g>
      <text x="74" y="40" fill="#f2f9ff" font-size="14" font-weight="600">Tidy your list</text>
      <text x="74" y="59" fill="#7386ac" font-size="11.5">Hit Select, tick any chats or groups, then</text>
      <text x="74" y="76" fill="#7386ac" font-size="11.5">Delete. Direct chats and groups can be mixed.</text>

      <line x1="24" y1="96" x2="416" y2="96" stroke="#22385c"/>
      <circle cx="34" cy="120" r="7" fill="rgba(246,196,69,.16)"/>
      <text x="34" y="124" fill="#f6c445" font-size="10" font-weight="700" text-anchor="middle">!</text>
      <text x="52" y="118" fill="#f6c445" font-size="11" font-weight="600">Removed from your list only</text>
      <text x="52" y="134" fill="#7386ac" font-size="10.5">Nothing is deleted on the server — they come back next session.</text>
    </g>

    <!-- pointer from panel to the checkbox -->
    <path d="M396 176 C 360 176, 350 208, 60 208" stroke="#ff7c9b" stroke-width="1.6" stroke-dasharray="5 5" fill="none" opacity=".5"/>

    <!-- ======================= EMPTY THREAD ======================= -->
    <g transform="translate(620 420)">
      <rect x="-42" y="-64" width="84" height="84" rx="28" fill="rgba(53,208,224,.09)" stroke="#22385c"/>
      <path d="M-17-34h34a8 8 0 018 8v17a8 8 0 01-8 8h-21l-13 10v-10a8 8 0 01-8-8v-17a8 8 0 018-8z" fill="none" stroke="#35d0e0" stroke-width="2.6" stroke-linejoin="round"/>
      <text x="0" y="56" fill="#f2f9ff" font-size="15" font-weight="600" text-anchor="middle">Pick a conversation</text>
      <text x="0" y="80" fill="#7386ac" font-size="11.5" text-anchor="middle">Leave selection mode to open one again.</text>
    </g>
  </g>

  <rect width="900" height="600" rx="18" fill="none" stroke="rgba(150,172,224,.26)" stroke-width="1.5"/>
</svg>
