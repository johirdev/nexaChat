<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="The NexaChat sign-in card, with a name field and a phone number field">
  <defs>
    <linearGradient id="lgSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fd1b4"/><stop offset=".3" stop-color="#35d0e0"/>
      <stop offset=".62" stop-color="#4a8cf7"/><stop offset="1" stop-color="#8b4dff"/>
    </linearGradient>
    <linearGradient id="lgBtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d3df0"/><stop offset="1" stop-color="#8b4dff"/>
    </linearGradient>
    <radialGradient id="lgGlowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b4dff" stop-opacity=".3"/><stop offset="1" stop-color="#8b4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lgGlowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1fd1b4" stop-opacity=".22"/><stop offset="1" stop-color="#1fd1b4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lgFrame"><rect width="900" height="600" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#lgFrame)" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect width="900" height="600" fill="#070c1a"/>
    <ellipse cx="720" cy="60" rx="360" ry="240" fill="url(#lgGlowA)"/>
    <ellipse cx="120" cy="540" rx="320" ry="220" fill="url(#lgGlowB)"/>

    <!-- faint grid -->
    <g stroke="rgba(150,172,224,.055)">
      <path d="M56 0V600M112 0V600M168 0V600M224 0V600M280 0V600M336 0V600M392 0V600M448 0V600M504 0V600M560 0V600M616 0V600M672 0V600M728 0V600M784 0V600M840 0V600"/>
      <path d="M0 56H900M0 112H900M0 168H900M0 224H900M0 280H900M0 336H900M0 392H900M0 448H900M0 504H900M0 560H900"/>
    </g>

    <!-- ================= left: the pitch ================= -->
    <text x="60" y="150" fill="#1fd1b4" font-size="11" font-weight="700" letter-spacing="1.8">WELCOME BACK</text>
    <text x="60" y="196" fill="#f2f6ff" font-size="34" font-weight="700" letter-spacing="-1.3">One number away from</text>
    <text x="60" y="238" font-size="34" font-weight="700" letter-spacing="-1.3" fill="url(#lgSweep)">your people</text>
    <text x="358" y="238" fill="#f2f6ff" font-size="34" font-weight="700">.</text>

    <text x="60" y="280" fill="#a5b3d1" font-size="13.5">No sign-up form to fill in and no password to</text>
    <text x="60" y="302" fill="#a5b3d1" font-size="13.5">remember. A number and a name is all it takes.</text>

    <g>
      <path d="M62 336l4 4 8-8" stroke="#1fd1b4" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="341" fill="#f2f6ff" font-size="13" font-weight="600">No password to invent</text>
      <text x="248" y="341" fill="#a5b3d1" font-size="13">— your number is the account</text>

      <path d="M62 372l4 4 8-8" stroke="#1fd1b4" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="377" fill="#f2f6ff" font-size="13" font-weight="600">New number? Account created</text>
      <text x="292" y="377" fill="#a5b3d1" font-size="13">— instantly</text>

      <path d="M62 408l4 4 8-8" stroke="#1fd1b4" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="413" fill="#f2f6ff" font-size="13" font-weight="600">Straight into your conversations</text>
    </g>

    <line x1="60" y1="446" x2="400" y2="446" stroke="rgba(150,172,224,.13)"/>
    <g>
      <circle cx="74" cy="478" r="15" fill="#1fd1b4"/><text x="74" y="483" fill="#04121c" font-size="11" font-weight="700" text-anchor="middle">J</text>
      <circle cx="95" cy="478" r="15" fill="#35d0e0" stroke="#070c1a" stroke-width="2.5"/><text x="95" y="483" fill="#04121c" font-size="11" font-weight="700" text-anchor="middle">M</text>
      <circle cx="116" cy="478" r="15" fill="#4a8cf7" stroke="#070c1a" stroke-width="2.5"/><text x="116" y="483" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">S</text>
      <circle cx="137" cy="478" r="15" fill="#131d3d" stroke="#070c1a" stroke-width="2.5"/><text x="137" y="483" fill="#35d0e0" font-size="11" font-weight="700" text-anchor="middle">+</text>
      <text x="164" y="483" fill="#a5b3d1" font-size="12" font-weight="600">12k+</text>
      <text x="200" y="483" fill="#7386ac" font-size="12">people are already talking</text>
    </g>

    <!-- ================= right: the card ================= -->
    <rect x="500" y="66" width="352" height="470" rx="22" fill="url(#lgSweep)"/>
    <rect x="501.2" y="67.2" width="349.6" height="467.6" rx="21" fill="#111a38"/>

    <!-- logo mark -->
    <g transform="translate(645 100)">
      <path d="M4 34C4 16 18 4 34 10s18 26 32 26" stroke="#1fd1b4" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>
      <path d="M18 44c8-14 22-14 30 0" stroke="#8b4dff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>
    </g>
    <text x="676" y="182" fill="#f2f6ff" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="-.6">Nexa<tspan fill="url(#lgSweep)">Chat</tspan></text>

    <rect x="618" y="200" width="116" height="24" rx="12" fill="rgba(31,209,180,.13)" stroke="rgba(150,172,224,.26)"/>
    <path d="M638 212v-3a4 4 0 018 0v3" stroke="#1fd1b4" stroke-width="1.6" fill="none"/>
    <rect x="635" y="211" width="14" height="9" rx="2" fill="#1fd1b4"/>
    <text x="682" y="216" fill="#1fd1b4" font-size="10" font-weight="700" text-anchor="middle">Secure access</text>

    <text x="676" y="248" fill="#a5b3d1" font-size="11.5" text-anchor="middle">Use your phone number to sign in or</text>
    <text x="676" y="265" fill="#a5b3d1" font-size="11.5" text-anchor="middle">create your NexaChat account.</text>

    <!-- name field -->
    <text x="532" y="298" fill="#f2f6ff" font-size="11.5" font-weight="600">Your name</text>
    <rect x="532" y="308" width="288" height="42" rx="12" fill="rgba(0,0,0,.3)" stroke="rgba(150,172,224,.26)"/>
    <circle cx="552" cy="326" r="4.6" fill="none" stroke="#7386ac" stroke-width="1.6"/>
    <path d="M545 334c1.6-3.4 12.4-3.4 14 0" stroke="#7386ac" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <text x="572" y="331" fill="#f2f6ff" font-size="12.5">Johirul Islam</text>

    <!-- phone field (focused) -->
    <text x="532" y="378" fill="#f2f6ff" font-size="11.5" font-weight="600">Phone number</text>
    <rect x="529" y="385" width="294" height="48" rx="14" fill="rgba(53,208,224,.13)"/>
    <rect x="532" y="388" width="288" height="42" rx="12" fill="rgba(0,0,0,.3)" stroke="#35d0e0" stroke-width="1.5"/>
    <path d="M548 405c0-1.6 1.4-3 3-3h2.4c1.2 0 2.3.8 2.7 2l1 3a2.8 2.8 0 01-.8 3l-1 1a12 12 0 005.4 5.4l1-1a2.8 2.8 0 013-.8l3 1c1.2.4 2 1.5 2 2.7v2.4c0 1.6-1.4 3-3 3A17.6 17.6 0 01548 405z" fill="#35d0e0"/>
    <text x="572" y="411" fill="#f2f6ff" font-size="12.5">01824842336</text>
    <rect x="676" y="402" width="1.6" height="15" fill="#35d0e0"/>

    <!-- submit -->
    <rect x="532" y="452" width="288" height="46" rx="12" fill="url(#lgBtn)"/>
    <text x="662" y="480" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle">Continue</text>
    <path d="M700 475h12m-4.5-4.5L712 475l-4.5 4.5" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="676" y="518" fill="#7386ac" font-size="10" text-anchor="middle">New phone numbers are registered automatically.</text>
  </g>

  <rect width="900" height="600" rx="18" fill="none" stroke="rgba(150,172,224,.26)" stroke-width="1.5"/>
</svg>
